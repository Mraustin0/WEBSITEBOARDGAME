services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: boardgame-everyday

  server:
    build:
      context: ./server
    depends_on:
      - mongo
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/boardgame-everyday
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    profiles: ['app']

volumes:
  mongo-data:
